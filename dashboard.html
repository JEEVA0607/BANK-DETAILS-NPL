<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <title>Bank QR Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="layout">

        <!-- Sidebar -->
         
        <div class="sidebar">

            <div class="logoArea">

    <div class="logoIcon">🏦</div>

    <h2>NPL BANK PANEL</h2>


</div>

            <button class="menuBtn active" id="homeBtn">
            🏠 Home
           <span id="homeCount">0</span>
</button>

            <button class="menuBtn" id="belowBtn">
    💰 10K Below Banks
    <span id="belowCount">0</span>
</button>

            <button class="menuBtn" id="aboveBtn">
    💵 10K Above Banks
    <span id="aboveCount">0</span>
</button>

            <button class="menuBtn" id="merchantBtn">
    🏢 Merchant Banks
    <span id="merchantCount">0</span>
</button>

<button class="menuBtn" id="favoriteBtn">
    ⭐ Favorites
    <span id="favoriteCountSide">0</span>
</button>

<button class="menuBtn" id="closedBtn">
    🚫 Temporary Closed
    <span id="closedCount">0</span>
</button>

            <button class="menuBtn" id="optionsBtn">
    ⚙️ Options
</button>


<div class="sidebarBottom">

    <button class="menuBtn logoutMenu" id="logoutBtn">
        🚪 Logout
    </button>

</div>

        </div>

        

        <!-- Main Content -->

    <!-- MAIN -->
     

    <div class="mainContent">

        <div class="centerContent"></div>
        

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <div class="header">

        <div class="title">

            🏦 Bank QR Manager

        </div>

        <input
            type="text"
            id="searchInput"
            placeholder="Search Bank...">
             
    </div>



    <!-- ========================= -->
    <!-- TOOLBAR -->
    <!-- ========================= -->

    <div class="toolbar">

        <div class="stats">

    <div class="statCard">

        <h3 id="totalBanks">0</h3>

        <p>Total Banks</p>

    </div>

    <div class="statCard">

        <h3 id="favoriteBanks">0</h3>

        <p>Favorites</p>

    </div>

</div>
        

        <button id="addBankBtn">

            ➕ Add Bank

        </button>

        <button id="exportBtn">

            📤 Export

        </button>

        <button id="importBtn">

            📥 Import

        </button>

    </div>

    



    <input
        type="file"
        id="importFile"
        hidden>



    <!-- ========================= -->
    <!-- BANK LIST -->
    <!-- ========================= -->

    <div id="bankContainer">

        </div>

    </div>

    <!-- ========================= -->
<!-- RIGHT SIDEBAR -->
<!-- ========================= -->

<div class="rightSidebar">

    <div class="rightTitle">
        Control Panel
    </div>

    <div class="rightGroup">

        <button id="addBankBtn2" class="rightBtn">
            ➕ Add Bank
        </button>

        <button id="exportBtn2" class="rightBtn">
            📤 Export
        </button>

        <button id="importBtn2" class="rightBtn">
            📥 Import
        </button>

    </div>

    <div class="rightTitle">
        Statistics
    </div>

    <div class="statCard">

        <div>Total Banks</div>

        <strong id="totalBanks2">0</strong>

    </div>

    <div class="statCard">

        <div>Favorites</div>

        <strong id="favoriteBanks2">0</strong>

    </div>

    <div class="rightTitle">
        View
    </div>

    <button class="rightBtn" id="gridViewBtn">

        🔳 Grid View

    </button>

    <button class="rightBtn" id="listViewBtn">

        📋 List View

    </button>

    <div class="rightTitle">

        System

    </div>

    <button class="rightBtn" id="settingsBtn2">

        ⚙ Settings

    </button>

</div>
    

</div>

<!-- ========================= -->
<!-- ADD BANK MODAL -->
<!-- ========================= -->

<div class="modal" id="addModal">

    <div class="modalContent">

        <h2>Add Bank</h2>

        <label>Display Name</label>
        <input type="text" id="displayName">

        <label>Bank Category *</label>

<div class="categoryBox">

    <label class="categoryItem">
        <input type="radio" name="category" value="10K Below">
        💰 10K Below Banks
    </label>

    <label class="categoryItem">
        <input type="radio" name="category" value="10K Above">
        💵 10K Above Banks
    </label>

    <label class="categoryItem">
        <input type="radio" name="category" value="Merchant">
        🏢 Merchant Banks
    </label>

</div>

        <label>Bank Logo</label>
        <input type="file"
               id="bankLogo"
               accept="image/*">

               <img id="logoPreview" class="previewImage" src="">

        <label>QR Image</label>
        <input type="file"
               id="qrImage"
               accept="image/*">

               <img id="qrPreview" class="previewImage" src="">

        <label class="checkRow">

            <input
                type="checkbox"
                id="extraToggle">

            Add Bank Details

        </label>

        <div id="extraSection">

            <label>Account Holder</label>
            <input
                type="text"
                id="holderName">

            <label>Account Number</label>
            <input
                type="text"
                id="accountNumber">

            <label>Bank Name</label>
            <input
                type="text"
                id="bankName">

            <label>Branch Name</label>
            <input
                type="text"
                id="branchName">

            <label>Remarks</label>
            <input
                type="text"
                id="remarks">

        </div>

        <div class="buttonRow">

            <button id="saveBank">

                💾 Save

            </button>

            <button id="closeModal">

                ✖ Close

            </button>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- VIEW QR MODAL -->
<!-- ========================= -->

<div class="modal" id="viewModal">

    <div class="viewContent">

        <h2>QR Preview</h2>

        <img
            id="viewImage"
            src=""
            alt="QR Preview">

        <div class="buttonRow">

            <button id="downloadQR">

                📥 Download

            </button>

            <button id="closeView">

                ✖ Close

            </button>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- OPTIONS MODAL -->
<!-- ========================= -->

<div class="modal" id="optionsModal">

    <div class="modalContent">

        <h2>⚙️ Options</h2>

        <div class="optionList">

            <button id="backupBtn" class="optionBtn">
                💾 Backup Data
            </button>

            <button id="restoreBtn" class="optionBtn">
                📂 Restore Backup
            </button>

            <button id="clearAllBtn" class="optionBtn">
                🗑 Clear All Banks
            </button>

            <button id="resetFavBtn" class="optionBtn">
                ⭐ Reset Favorites
            </button>

            <button id="closeOptions" class="optionBtn closeOption">
                ✖ Close
            </button>

        </div>

    </div>

</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>

<script src="script.js"></script>


<body class="gridMode"></body>

</body>
</html>
